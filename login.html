<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Register — AhmadUllah</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<header class="site-header">
  <div class="nav-row">
    <a href="index.html" class="brand"><span class="brand-mark">AH</span>AhmadUllah</a>
    <nav class="nav-menu" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="jobs.html">Find Jobs</a>
      <a href="marketplace.html">Marketplace</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="my-proposals.html">My Proposals</a>
      <a href="orders.html">Orders &amp; Projects</a>
      <a href="messages.html">Messages</a>
      <a href="post-job.html">Post a Job</a>
    </nav>
    <div class="nav-actions">
      <a href="favorites.html" class="nav-icon-btn" aria-label="Favorites">❤️</a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main id="main" class="section" style="padding-top: var(--space-6);">
  <div class="container" style="max-width:440px;margin:0 auto;">
    <div class="form-card">
      <div class="tabs-row" style="justify-content:center;margin-bottom:var(--space-5);">
        <button type="button" class="tab-btn is-active" id="tab-login">Login</button>
        <button type="button" class="tab-btn" id="tab-register">Register</button>
      </div>

      <form id="login-form">
        <div class="form-row">
          <label class="field-label" for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" required>
        </div>
        <div class="form-row">
          <label class="field-label" for="login-pass">Password</label>
          <input type="password" id="login-pass" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        <p class="field-hint" style="text-align:center;margin-top:12px;">Demo: any email + password works (frontend only).</p>
      </form>

      <form id="register-form" hidden>
        <div class="form-row">
          <label class="field-label" for="reg-name">Full name</label>
          <input type="text" id="reg-name" placeholder="Your name" required>
        </div>
        <div class="form-row">
          <label class="field-label" for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" required>
        </div>
        <div class="form-row">
          <label class="field-label" for="reg-pass">Password</label>
          <input type="password" id="reg-pass" placeholder="Min 6 characters" required minlength="6">
        </div>
        <div class="form-row">
          <label class="field-label">I want to</label>
          <div class="radio-card-group">
            <label class="radio-card"><input type="radio" name="role" value="freelancer" checked><span>Freelance</span></label>
            <label class="radio-card"><input type="radio" name="role" value="client"><span>Hire</span></label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-row">
    <span>© <span data-current-year></span> AhmadUllah. Frontend prototype.</span>
  </div>
</footer>

<script src="app.js"></script>
<script>
(function(){
  const loginForm = document.getElementById('login-form');
  const regForm = document.getElementById('register-form');
  document.getElementById('tab-login').addEventListener('click', () => {
    document.getElementById('tab-login').classList.add('is-active');
    document.getElementById('tab-register').classList.remove('is-active');
    loginForm.hidden = false; regForm.hidden = true;
  });
  document.getElementById('tab-register').addEventListener('click', () => {
    document.getElementById('tab-register').classList.add('is-active');
    document.getElementById('tab-login').classList.remove('is-active');
    regForm.hidden = false; loginForm.hidden = true;
  });
  loginForm.addEventListener('submit', e => {
    e.preventDefault();
    showToast('Welcome back, AhmadUllah!');
    setTimeout(() => location.href = 'dashboard.html', 800);
  });
  regForm.addEventListener('submit', e => {
    e.preventDefault();
    showToast('Account created — welcome!');
    setTimeout(() => location.href = 'dashboard.html', 800);
  });
})();
</script>
</body>
</html>
